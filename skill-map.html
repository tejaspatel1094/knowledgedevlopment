<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Map — Data Science, Analytics, ML &amp; AI</title>
<style>
  :root{
    --bg:#f6f7f9;
    --panel:#ffffff;
    --ink:#1b1f24;
    --muted:#6b7280;
    --line:#dfe3e8;
    --accent:#2f6fed;
    --learn:#e0912f;
    --done:#2e9e6b;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 12px rgba(16,24,40,.05);
  }
  html.dark{
    --bg:#0f1216; --panel:#171b21; --ink:#e6e9ee; --muted:#98a2b3;
    --line:#2a313b; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); overflow:hidden;
  }
  button,input,select{font:inherit;color:inherit}

  /* ---------- top bar ---------- */
  #top{
    position:fixed;top:0;left:0;right:0;height:56px;z-index:40;
    display:flex;align-items:center;gap:10px;padding:0 14px;
    background:var(--panel);border-bottom:1px solid var(--line);
  }
  #title{font-weight:650;letter-spacing:-.01em;white-space:nowrap}
  #title small{display:block;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:0}
  .sp{flex:1}
  .btn{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:6px 10px;cursor:pointer;white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .grp{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .grp .btn{border:0;border-radius:0;border-right:1px solid var(--line)}
  .grp .btn:last-child{border-right:0}
  #search{
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:230px;
    background:var(--panel);
  }
  #search:focus{outline:2px solid rgba(47,111,237,.25);border-color:var(--accent)}
  #hits{font-size:12px;color:var(--muted);min-width:60px}

  /* ---------- progress strip ---------- */
  #strip{
    position:fixed;top:56px;left:0;right:0;height:38px;z-index:39;
    display:flex;align-items:center;gap:14px;padding:0 14px;
    background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;
  }
  #bar{flex:0 0 260px;height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
  #bar i{display:block;height:100%}
  #bar .d{background:var(--done)}
  #bar .l{background:var(--learn)}
  .key{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:99px;display:inline-block}
  .dot.n{background:var(--line);border:1px solid var(--muted)}
  .dot.l{background:var(--learn)}
  .dot.d{background:var(--done)}
  #saveState{color:var(--muted)}

  /* ---------- crumbs ---------- */
  #crumbs{
    position:fixed;top:94px;left:0;right:0;z-index:38;padding:6px 14px;
    font-size:12px;color:var(--muted);background:linear-gradient(var(--bg),rgba(0,0,0,0));
    pointer-events:none;
  }
  #crumbs a{pointer-events:auto;cursor:pointer;color:var(--accent);text-decoration:none}
  #crumbs a:hover{text-decoration:underline}

  /* ---------- canvas ---------- */
  #viewport{position:fixed;inset:94px 0 0 0;overflow:hidden;cursor:grab}
  #viewport.drag{cursor:grabbing}
  #canvas{position:absolute;top:0;left:0;transform-origin:0 0}
  #links{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
  #nodes{position:absolute;top:0;left:0}

  .node{
    position:absolute;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;box-shadow:var(--shadow);padding:8px 10px 8px 13px;
    cursor:pointer;transition:border-color .12s,box-shadow .12s;
  }
  .node:hover{border-color:var(--hue,#2f6fed)}
  .node.sel{border-color:var(--hue,#2f6fed);box-shadow:0 0 0 3px rgba(47,111,237,.18),var(--shadow)}
  .node::before{
    content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:99px;
    background:var(--hue,#c9ced6);
  }
  .node.st1::before{background:var(--learn)}
  .node.st2::before{background:var(--done)}
  .node.st2 .lab{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
  .node.match .lab mark{background:#ffe58a;color:inherit;border-radius:3px;padding:0 1px}
  html.dark .node.match .lab mark{background:#6b5a1e;color:#fff}
  .node.dim{opacity:.42}
  .lab{font-weight:560;letter-spacing:-.005em;display:block}
  .node.d0 .lab{font-size:16px;font-weight:680}
  .node.d1 .lab{font-size:14.5px;font-weight:640}
  .node.d2 .lab{font-size:13.5px}
  .node.d3 .lab,.node.d4 .lab,.node.d5 .lab{font-size:12.8px;font-weight:520}
  .note{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.35}
  .mynote{
    font-size:11.5px;margin-top:5px;padding:4px 6px;border-radius:6px;
    background:rgba(47,111,237,.08);border-left:2px solid var(--accent);white-space:pre-wrap;
  }
  .foot{display:flex;align-items:center;gap:6px;margin-top:5px}
  .chev{
    font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;
    padding:0 4px;line-height:15px;height:16px;display:inline-flex;align-items:center;gap:3px;
  }
  .node.open .chev{color:var(--hue,#2f6fed);border-color:var(--hue,#2f6fed)}
  .cnt{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .mini{width:44px;height:4px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
  .mini i{height:100%;display:block}
  .mini .d{background:var(--done)}
  .mini .l{background:var(--learn)}
  .tools{
    position:absolute;top:-13px;right:6px;display:none;gap:2px;z-index:5;
    background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:1px;
    box-shadow:var(--shadow);
  }
  .node:hover .tools{display:flex}
  .tools button{
    border:0;background:transparent;cursor:pointer;border-radius:5px;
    width:22px;height:20px;line-height:1;font-size:12px;color:var(--muted);padding:0;
  }
  .tools button:hover{background:rgba(47,111,237,.12);color:var(--accent)}

  /* ---------- side panel ---------- */
  #side{
    position:fixed;top:94px;right:0;bottom:0;width:290px;z-index:37;
    background:var(--panel);border-left:1px solid var(--line);
    padding:14px;overflow:auto;transform:translateX(100%);transition:transform .18s;
  }
  #side.open{transform:none}
  #side h3{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .brow{padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .brow:hover .bname{color:var(--accent)}
  .bname{font-size:12.5px;font-weight:560;display:flex;justify-content:space-between;gap:8px}
  .bname span{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
  .brow .mini{width:100%;margin-top:5px;height:5px}
  #closeSide{position:absolute;top:10px;right:10px}

  /* ---------- zoom controls ---------- */
  #zoom{
    position:fixed;left:14px;bottom:14px;z-index:36;display:flex;flex-direction:column;
    border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel);
    box-shadow:var(--shadow);
  }
  #zoom button{border:0;background:transparent;width:32px;height:30px;cursor:pointer;
    border-bottom:1px solid var(--line);font-size:14px}
  #zoom button:last-child{border-bottom:0}
  #zoom button:hover{background:rgba(47,111,237,.1);color:var(--accent)}
  #hint{
    position:fixed;left:56px;bottom:18px;z-index:35;font-size:11.5px;color:var(--muted);
    pointer-events:none;
  }
  #empty{
    position:fixed;inset:94px 0 0 0;display:none;align-items:center;justify-content:center;
    color:var(--muted);font-size:14px;z-index:5;
  }
  @media (max-width:780px){
    #title small,#hint,.wide{display:none}
    #search{width:130px}
    #bar{flex-basis:110px}
  }
</style>
</head>
<body>

<div id="top">
  <div id="title">Skill Map <small>Data Science · Analytics · ML · AI</small></div>
  <input id="search" type="search" placeholder="Search skills…  (/)">
  <span id="hits"></span>
  <div class="sp"></div>
  <div class="grp wide">
    <button class="btn" data-lvl="1" title="Show top-level branches only">L1</button>
    <button class="btn" data-lvl="2">L2</button>
    <button class="btn" data-lvl="3">L3</button>
    <button class="btn" data-lvl="99" title="Expand everything (slow)">All</button>
    <button class="btn" id="collapseAll" title="Collapse everything">–</button>
  </div>
  <select id="filter" class="btn" title="Filter by status">
    <option value="all">All statuses</option>
    <option value="0">Not started</option>
    <option value="1">Learning</option>
    <option value="2">Done</option>
    <option value="act">Learning + Done</option>
    <option value="note">Has my notes</option>
    <option value="mine">My added nodes</option>
  </select>
  <button class="btn" id="notesBtn" title="Show / hide the descriptions">Notes</button>
  <button class="btn" id="sideBtn" title="Progress by branch">Progress</button>
  <div class="grp">
    <button class="btn" id="exportBtn" title="Download your progress as a JSON backup">Export</button>
    <button class="btn" id="importBtn" title="Restore from a JSON backup">Import</button>
  </div>
  <button class="btn" id="themeBtn" title="Light / dark">◐</button>
  <input type="file" id="fileIn" accept="application/json" hidden>
</div>

<div id="strip">
  <strong id="pct">0%</strong>
  <div id="bar"><i class="d" style="width:0"></i><i class="l" style="width:0"></i></div>
  <span class="key"><i class="dot d"></i><b id="cDone">0</b> done</span>
  <span class="key"><i class="dot l"></i><b id="cLearn">0</b> learning</span>
  <span class="key"><i class="dot n"></i><b id="cTodo">0</b> to go</span>
  <span class="key wide" id="cTotal"></span>
  <div class="sp"></div>
  <span id="saveState" class="wide">saved</span>
  <button class="btn" id="resetBtn" title="Clear all statuses and custom nodes">Reset</button>
</div>

<div id="crumbs"></div>

<div id="viewport">
  <div id="canvas">
    <svg id="links"><g id="linkg"></g></svg>
    <div id="nodes"></div>
  </div>
</div>
<div id="empty">Nothing matches — clear the search or filter.</div>

<div id="zoom">
  <button id="zIn" title="Zoom in">+</button>
  <button id="zOut" title="Zoom out">−</button>
  <button id="zFit" title="Fit to screen">⤢</button>
</div>
<div id="hint">Click a node to expand · drag to pan · ⌘/Ctrl + scroll to zoom · <b>+</b> on a node to add your own</div>

<script>
"use strict";
/* ============================================================
   DATA — the seeded skill tree
   ============================================================ */
const TREE = {"l":"Data Science, Analytics, ML & AI","n":"My learning map. Click any node to expand. Double-click a node to cycle its status.","id":"root","c":[{"l":"Mathematical Foundations","n":"The language everything else is written in. Depth here is what separates users of models from builders of them.","c":[{"l":"Probability Theory","n":"","c":[{"l":"Core Objects","n":"","c":[{"l":"Sample spaces, events, sigma-algebras","n":"The formal scaffolding; enough intuition to reason about what is measurable.","c":[],"id":"mathematical-foundations/probability-theory/core-objects/sample-spaces-events-sigma-algebra"},{"l":"Random variables","n":"Discrete vs continuous, support, transformations of variables.","c":[],"id":"mathematical-foundations/probability-theory/core-objects/random-variables"},{"l":"Expectation, variance, moments","n":"Linearity of expectation is the single most-used trick in ML proofs.","c":[],"id":"mathematical-foundations/probability-theory/core-objects/expectation-variance-moments"},{"l":"Joint, marginal, conditional distributions","n":"The engine behind every probabilistic model.","c":[],"id":"mathematical-foundations/probability-theory/core-objects/joint-marginal-conditional-distrib"},{"l":"Independence and conditional independence","n":"Conditional independence is the backbone of graphical models.","c":[],"id":"mathematical-foundations/probability-theory/core-objects/independence-and-conditional-indep"},{"l":"Law of total probability and Bayes rule","n":"Derive it from scratch until it is reflex.","c":[],"id":"mathematical-foundations/probability-theory/core-objects/law-of-total-probability-and-bayes"}],"id":"mathematical-foundations/probability-theory/core-objects"},{"l":"Distributions Worth Knowing Cold","n":"","c":[{"l":"Bernoulli, Binomial, Categorical, Multinomial","n":"Classification likelihoods live here.","c":[],"id":"mathematical-foundations/probability-theory/distributions-worth-knowing-cold/bernoulli-binomial-categorical-mul"},{"l":"Gaussian and multivariate Gaussian","n":"Covariance structure, marginals, conditionals, whitening.","c":[],"id":"mathematical-foundations/probability-theory/distributions-worth-knowing-cold/gaussian-and-multivariate-gaussian"},{"l":"Poisson and Exponential","n":"Counts and waiting times; the basis of survival and queueing models.","c":[],"id":"mathematical-foundations/probability-theory/distributions-worth-knowing-cold/poisson-and-exponential"},{"l":"Beta, Gamma, Dirichlet","n":"Conjugate priors; Dirichlet powers topic models.","c":[],"id":"mathematical-foundations/probability-theory/distributions-worth-knowing-cold/beta-gamma-dirichlet"},{"l":"Student-t, Chi-square, F","n":"Test statistics and heavy-tailed robustness.","c":[],"id":"mathematical-foundations/probability-theory/distributions-worth-knowing-cold/student-t-chi-square-f"},{"l":"Heavy-tailed and power-law distributions","n":"Why averages mislead in web, finance, and network data.","c":[],"id":"mathematical-foundations/probability-theory/distributions-worth-knowing-cold/heavy-tailed-and-power-law-distrib"},{"l":"Exponential family","n":"Unifies GLMs, sufficient statistics, and natural parameters.","c":[],"id":"mathematical-foundations/probability-theory/distributions-worth-knowing-cold/exponential-family"}],"id":"mathematical-foundations/probability-theory/distributions-worth-knowing-cold"},{"l":"Limit Theorems and Concentration","n":"","c":[{"l":"Law of large numbers","n":"Why sample means converge at all.","c":[],"id":"mathematical-foundations/probability-theory/limit-theorems-and-concentration/law-of-large-numbers"},{"l":"Central limit theorem","n":"And crucially, when it fails you.","c":[],"id":"mathematical-foundations/probability-theory/limit-theorems-and-concentration/central-limit-theorem"},{"l":"Delta method","n":"Variance of a transformed estimator.","c":[],"id":"mathematical-foundations/probability-theory/limit-theorems-and-concentration/delta-method"},{"l":"Markov, Chebyshev, Hoeffding bounds","n":"Finite-sample guarantees rather than asymptotics.","c":[],"id":"mathematical-foundations/probability-theory/limit-theorems-and-concentration/markov-chebyshev-hoeffding-bounds"},{"l":"Concentration of measure intuition","n":"High-dimensional geometry is deeply unintuitive.","c":[],"id":"mathematical-foundations/probability-theory/limit-theorems-and-concentration/concentration-of-measure-intuition"}],"id":"mathematical-foundations/probability-theory/limit-theorems-and-concentration"},{"l":"Stochastic Processes","n":"","c":[{"l":"Markov chains","n":"Transition matrices, stationary distributions, mixing time.","c":[],"id":"mathematical-foundations/probability-theory/stochastic-processes/markov-chains"},{"l":"Poisson processes","n":"Arrivals, thinning, superposition.","c":[],"id":"mathematical-foundations/probability-theory/stochastic-processes/poisson-processes"},{"l":"Random walks and martingales","n":"Foundations for bandits and sequential testing.","c":[],"id":"mathematical-foundations/probability-theory/stochastic-processes/random-walks-and-martingales"},{"l":"Gaussian processes","n":"Priors over functions; the bridge to Bayesian optimization.","c":[],"id":"mathematical-foundations/probability-theory/stochastic-processes/gaussian-processes"},{"l":"Hidden Markov models","n":"Forward-backward, Viterbi, Baum-Welch.","c":[],"id":"mathematical-foundations/probability-theory/stochastic-processes/hidden-markov-models"}],"id":"mathematical-foundations/probability-theory/stochastic-processes"}],"id":"mathematical-foundations/probability-theory"},{"l":"Linear Algebra","n":"","c":[{"l":"Vectors, Spaces, and Maps","n":"","c":[{"l":"Vector spaces, span, basis, rank","n":"Rank is the honest answer to \"how much information is here\".","c":[],"id":"mathematical-foundations/linear-algebra/vectors-spaces-and-maps/vector-spaces-span-basis-rank"},{"l":"Linear transformations as matrices","n":"Every layer of a neural net is one of these plus a nonlinearity.","c":[],"id":"mathematical-foundations/linear-algebra/vectors-spaces-and-maps/linear-transformations-as-matrices"},{"l":"Norms and inner products","n":"L1 vs L2 vs L-infinity and what each penalizes.","c":[],"id":"mathematical-foundations/linear-algebra/vectors-spaces-and-maps/norms-and-inner-products"},{"l":"Orthogonality and projections","n":"Least squares is just a projection.","c":[],"id":"mathematical-foundations/linear-algebra/vectors-spaces-and-maps/orthogonality-and-projections"},{"l":"Four fundamental subspaces","n":"Column, row, null, left-null; explains solvability.","c":[],"id":"mathematical-foundations/linear-algebra/vectors-spaces-and-maps/four-fundamental-subspaces"}],"id":"mathematical-foundations/linear-algebra/vectors-spaces-and-maps"},{"l":"Decompositions","n":"","c":[{"l":"Eigenvalues and eigenvectors","n":"Spectral thinking: what does this operator stretch.","c":[],"id":"mathematical-foundations/linear-algebra/decompositions/eigenvalues-and-eigenvectors"},{"l":"Singular value decomposition","n":"The most useful factorization in all of data science.","c":[],"id":"mathematical-foundations/linear-algebra/decompositions/singular-value-decomposition"},{"l":"QR and Gram-Schmidt","n":"Numerically stable least squares.","c":[],"id":"mathematical-foundations/linear-algebra/decompositions/qr-and-gram-schmidt"},{"l":"Cholesky decomposition","n":"Sampling correlated Gaussians, solving normal equations fast.","c":[],"id":"mathematical-foundations/linear-algebra/decompositions/cholesky-decomposition"},{"l":"LU and matrix inverses","n":"And why you almost never actually invert a matrix.","c":[],"id":"mathematical-foundations/linear-algebra/decompositions/lu-and-matrix-inverses"},{"l":"Low-rank approximation","n":"Eckart-Young theorem; the theory behind compression and LoRA.","c":[],"id":"mathematical-foundations/linear-algebra/decompositions/low-rank-approximation"}],"id":"mathematical-foundations/linear-algebra/decompositions"},{"l":"Matrix Calculus","n":"","c":[{"l":"Gradients, Jaco "n":"","c":[],"id":"career-research-and-learning-how-t/working-effectively/time-and-attention-management-for-"},{"l":"Collaboration with engineers, PMs, and executives","n":"","c":[],"id":"career-research-and-learning-how-t/working-effectively/collaboration-with-engineers-pms-a"},{"l":"Mentoring and being mentored","n":"","c":[],"id":"career-research-and-learning-how-t/working-effectively/mentoring-and-being-mentored"},{"l":"Interviewing","n":"Case studies, SQL screens, ML system design, take-homes.","c":[],"id":"career-research-and-learning-how-t/working-effectively/interviewing"},{"l":"Career paths","n":"Analyst, data scientist, ML engineer, AI engineer, research, analytics engineering, leadership.","c":[],"id":"career-research-and-learning-how-t/working-effectively/career-paths"}],"id":"career-research-and-learning-how-t/working-effectively"},{"l":"Personal Learning Backlog","n":"Your own space. Add nodes here as topics come up that you want to return to.","c":[{"l":"Currently curious about","n":"","c":[],"id":"career-research-and-learning-how-t/personal-learning-backlog/currently-curious-about"},{"l":"Blocked or confusing","n":"","c":[],"id":"career-research-and-learning-how-t/personal-learning-backlog/blocked-or-confusing"},{"l":"Want to build","n":"","c":[],"id":"career-research-and-learning-how-t/personal-learning-backlog/want-to-build"}],"id":"career-research-and-learning-how-t/personal-learning-backlog"}],"id":"career-research-and-learning-how-t"}]};

/* ============================================================
   STATE
   ============================================================ */
const KEY = "skillmap.ds.v1";
const blank = () => ({status:{}, open:{root:true}, notes:{}, custom:{}, renamed:{}, deleted:{}, seq:1});
let S = blank();
let storageOK = true;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) S = Object.assign(blank(), JSON.parse(raw));
  }catch(e){ storageOK = false; }
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(KEY, JSON.stringify(S));
      flash(storageOK ? "saved" : "in-memory only");
    }catch(e){
      storageOK=false; flash("in-memory only — use Export to keep a copy");
    }
  }, 250);
}
function flash(t){ const el=document.getElementById("saveState"); el.textContent=t; }

/* ============================================================
   TREE ACCESS  (seed tree + user's custom nodes, minus deletions)
   ============================================================ */
/* IMPORTANT: nothing that lives inside S may hold object references — S gets
   JSON.stringify'd on every save, so parent pointers go in a side map instead. */
const INDEX = new Map();   // id -> node object
const META  = new Map();   // id -> {parent:id|null, depth, branch:id|null, mine:bool}

function indexAll(){
  INDEX.clear(); META.clear();
  (function walk(n, parentId, depth, branch, mine){
    INDEX.set(n.id, n);
    META.set(n.id, {parent:parentId, depth, branch, mine});
    const kids = (n.c||[]).concat(S.custom[n.id]||[]);
    for(const k of kids){
      k.c = k.c || [];
      const isMine = mine || !!(S.custom[n.id]||[]).includes(k);
      walk(k, n.id, depth+1, depth===0 ? k.id : branch, isMine);
    }
  })(TREE, null, 0, null, false);
}
const metaOf = id => META.get(id) || {parent:null, depth:0, branch:null, mine:false};

function labelOf(n){ return S.renamed[n.id] ?? n.l; }
function childrenOf(n){
  const base = (n.c||[]).filter(k => !S.deleted[k.id]);
  const mine = (S.custom[n.id]||[]).filter(k => !S.deleted[k.id]);
  return base.concat(mine);
}
function nodeById(id){ return INDEX.get(id) || null; }
function parentOf(n){ return nodeById(metaOf(n.id).parent); }

/* progress roll-up: one post-order pass per repaint, memoised */
let TAL = new Map();
function computeTallies(){
  TAL = new Map();
  (function walk(n){
    const kids = childrenOf(n);
    let t;
    if(!kids.length){
      const s = S.status[n.id]||0;
      t = {total:1, done:s===2?1:0, learn:s===1?1:0};
    }else{
      t = {total:0, done:0, learn:0};
      for(const k of kids){ const c = walk(k); t.total+=c.total; t.done+=c.done; t.learn+=c.learn; }
    }
    TAL.set(n.id, t);
    return t;
  })(TREE);
}
function tally(n){ return TAL.get(n.id) || {total:0, done:0, learn:0}; }

/* ============================================================
   VIEW STATE
   ============================================================ */
let rootId = "root";
let showNotes = true;
let query = "";
let filter = "all";
let selected = null;
let view = {x:60, y:40, k:1};

const viewport = document.getElementById("viewport");
const canvas   = document.getElementById("canvas");
const nodesEl  = document.getElementById("nodes");
const linksEl  = document.getElementById("links");
const linkg    = document.getElementById("linkg");

const COLW = [300,268,246,230,216,206,198,192];
const HGAP = 46;
function colw(d){ return COLW[Math.min(d, COLW.length-1)]; }
function colx(d){ let x=0; for(let i=0;i<d;i++) x += colw(i)+HGAP; return x; }
function vgap(d){ return d<=1 ? 30 : d===2 ? 16 : 11; }

const HUES = ["#2f6fed","#7c4dff","#b8317a","#d1453b","#c1650b","#8a8f0d","#2f8f46","#12897f",
              "#1273a8","#4a5bd6","#9b3fd4","#c2306a","#b5541c","#6f8c15","#1f8f6a","#0f7c9c"];
function hueOf(n){
  const b = metaOf(n.id).branch;
  if(!b) return "#8b93a1";
  const idx = childrenOf(TREE).findIndex(x => x.id === b);
  return HUES[(idx<0?0:idx) % HUES.length];
}

/* ---------- search / filter matching ---------- */
function matchesQuery(n){
  if(!query) return true;
  const hay = (labelOf(n) + " " + (n.n||"") + " " + (S.notes[n.id]||"")).toLowerCase();
  return hay.includes(query);
}
function matchesFilter(n){
  if(filter==="all") return true;
  const s = S.status[n.id]||0;
  if(filter==="0") return s===0;
  if(filter==="1") return s===1;
  if(filter==="2") return s===2;
  if(filter==="act") return s===1||s===2;
  if(filter==="note") return !!S.notes[n.id];
  if(filter==="mine") return !!metaOf(n.id).mine;
  return true;
}
function isHit(n){ return matchesQuery(n) && matchesFilter(n); }

// set of ids that must be visible because they or a descendant is a hit
let keepSet = null;
function buildKeep(){
  if(!query && filter==="all"){ keepSet=null; return 0; }
  keepSet = new Set(); let count=0;
  (function walk(n, chain){
    const nc = chain.concat(n.id);
    if(isHit(n)){ count++; nc.forEach(id=>keepSet.add(id)); }
    childrenOf(n).forEach(k=>walk(k, nc));
  })(nodeById(rootId), []);
  return count;
}

/* ============================================================
   RENDER
   ============================================================ */
const pool = new Map();   // id -> element
let vlist = [];           // visible node records

function buildVisible(){
  const root = nodeById(rootId) || TREE;
  const out = [];
  function rec(n, depth){
    const kids = childrenOf(n).filter(k => !keepSet || keepSet.has(k.id));
    const open = keepSet ? true : !!S.open[n.id];
    const rec_ = {n, depth, open: open && kids.length>0, kids:[], nkids:kids.length};
    out.push(rec_);
    if(rec_.open) rec_.kids = kids.map(k => rec(k, depth+1));
    return rec_;
  }
  const tree = rec(root, 0);
  return {tree, all: out};
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function hl(text){
  if(!query) return esc(text);
  const i = text.toLowerCase().indexOf(query);
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+query.length))+"</mark>"+esc(text.slice(i+query.length));
}

function paint(){
  indexAll();
  computeTallies();
  const hits = buildKeep();
  document.getElementById("hits").textContent =
    (query||filter!=="all") ? (hits + (hits===1?" match":" matches")) : "";

  const {tree, all} = buildVisible();
  document.getElementById("empty").style.display = all.length<=1 && (query||filter!=="all") ? "flex" : "none";

  // auto-compact: descriptions are noise once hundreds of nodes are on screen
  const notesOn = showNotes && all.length <= 220;

  const live = new Set();
  for(const r of all){
    const n = r.n, id = n.id; live.add(id);
    let el = pool.get(id);
    if(!el){
      el = document.createElement("div");
      el.className = "node";
      el.dataset.id = id;
      nodesEl.appendChild(el);
      pool.set(id, el);
    }
    const t = r.nkids ? tally(n) : null;
    const st = S.status[id]||0;
    const my = S.notes[id];
    el.className = "node d"+Math.min(r.depth,5) + (st?" st"+st:"") + (r.open?" open":"") +
                   (selected===id?" sel":"") + (query && matchesQuery(n) ? " match":"");
    el.style.width = colw(r.depth)+"px";
    el.style.setProperty("--hue", hueOf(n));
    el.innerHTML =
      '<div class="tools">'+
        '<button data-a="status" title="Cycle status: to-do → learning → done">'+(st===2?"✓":st===1?"◐":"○")+'</button>'+
        '<button data-a="add" title="Add a sub-skill of your own">+</button>'+
        '<button data-a="note" title="Add / edit your note">✎</button>'+
        '<button data-a="focus" title="Zoom into this branch">⤢</button>'+
        '<button data-a="rename" title="Rename">Aa</button>'+
        '<button data-a="del" title="Remove from my map">✕</button>'+
      '</div>'+
      '<span class="lab">'+hl(labelOf(n))+'</span>'+
      (notesOn && n.n ? '<div class="note">'+hl(n.n)+'</div>' : '')+
      (my ? '<div class="mynote">'+esc(my)+'</div>' : '')+
      (r.nkids ? '<div class="foot">'+
          '<span class="chev">'+(r.open?"▾":"▸")+' '+r.nkids+'</span>'+
          '<span class="mini"><i class="d" style="width:'+(t.done/t.total*100)+'%"></i>'+
                            '<i class="l" style="width:'+(t.learn/t.total*100)+'%"></i></span>'+
          '<span class="cnt">'+t.done+'/'+t.total+'</span>'+
        '</div>' : '');
  }
  for(const [id, el] of pool){ if(!live.has(id)){ el.remove(); pool.delete(id); } }

  // measure, then lay out
  const colBottom = [];
  let cursor = 0, maxX = 0, maxY = 0;
  for(const r of all) r.h = pool.get(r.n.id).offsetHeight;

  function shift(r, dy){
    r.y += dy;
    for(const k of r.kids) shift(k, dy);
  }
  function place(r){
    const d = r.depth, g = vgap(d);
    r.x = colx(d);
    if(!r.kids.length){
      const y = Math.max(cursor, colBottom[d]||0);
      r.y = y; cursor = y + r.h + g; colBottom[d] = cursor;
    }else{
      r.kids.forEach(place);
      const f=r.kids[0], l=r.kids[r.kids.length-1];
      let y = (f.y + f.h/2 + l.y + l.h/2)/2 - r.h/2;
      const min = colBottom[d]||0;
      if(y < min){ const dy = min - y; shift(r, dy); y += dy; cursor = Math.max(cursor, l.y+l.h+g); }
      r.y = y;
      colBottom[d] = Math.max(colBottom[d]||0, y + r.h + g);
      cursor = Math.max(cursor, colBottom[d]);
    }
    maxX = Math.max(maxX, r.x + colw(d));
    maxY = Math.max(maxY, r.y + r.h);
  }
  place(tree);

  for(const r of all){
    const el = pool.get(r.n.id);
    el.style.transform = "translate("+Math.round(r.x)+"px,"+Math.round(r.y)+"px)";
  }

  // links
  let path = "";
  (function link(r){
    for(const k of r.kids){
      const x1 = r.x + colw(r.depth), y1 = r.y + r.h/2;
      const x2 = k.x,                 y2 = k.y + k.h/2;
      const mx = x1 + (x2-x1)*0.5;
      path += 'M'+x1+' '+y1+'C'+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2;
      link(k);
    }
  })(tree);
  linksEl.setAttribute("width", maxX+80);
  linksEl.setAttribute("height", maxY+80);
  linkg.innerHTML = '<path d="'+path+'" fill="none" stroke="var(--line)" stroke-width="1.6"/>';

  applyView();
  stats();
  crumbs();
  lastBounds = {w:maxX, h:maxY};
}

let lastBounds = {w:1000,h:800};

function applyView(){
  canvas.style.transform = "translate("+view.x+"px,"+view.y+"px) scale("+view.k+")";
}

/* ---------- header stats ---------- */
function stats(){
  const t = tally(TREE);
  const pct = t.total ? Math.round(t.done/t.total*100) : 0;
  document.getElementById("pct").textContent = pct+"%";
  document.querySelector("#bar .d").style.width = (t.done/t.total*100)+"%";
  document.querySelector("#bar .l").style.width = (t.learn/t.total*100)+"%";
  document.getElementById("cDone").textContent = t.done;
  document.getElementById("cLearn").textContent = t.learn;
  document.getElementById("cTodo").textContent = t.total - t.done - t.learn;
  document.getElementById("cTotal").textContent = t.total + " learnable topics";
  sidePanel();
}

function sidePanel(){
  const side = document.getElementById("side");
  if(!side.classList.contains("open")) return;
  const box = document.getElementById("branches");
  box.innerHTML = "";
  for(const b of childrenOf(TREE)){
    const t = tally(b);
    const pct = t.total ? Math.round(t.done/t.total*100) : 0;
    const row = document.createElement("div");
    row.className = "brow";
    row.innerHTML = '<div class="bname">'+esc(labelOf(b))+'<span>'+pct+'%</span></div>'+
      '<div class="mini"><i class="d" style="width:'+(t.done/t.total*100)+'%"></i>'+
      '<i class="l" style="width:'+(t.learn/t.total*100)+'%"></i></div>'+
      '<div class="cnt">'+t.done+' done · '+t.learn+' learning · '+t.total+' topics</div>';
    row.onclick = ()=>{ focusNode(b.id); };
    box.appendChild(row);
  }
}

function crumbs(){
  const el = document.getElementById("crumbs");
  if(rootId==="root"){ el.innerHTML=""; return; }
  const chain=[]; let n=nodeById(rootId);
  while(n){ chain.unshift(n); n = parentOf(n); }
  el.innerHTML = chain.map((x,i)=> i===chain.length-1
      ? '<b>'+esc(labelOf(x))+'</b>'
      : '<a data-go="'+x.id+'">'+esc(labelOf(x))+'</a>').join(" &nbsp;›&nbsp; ");
  el.querySelectorAll("a").forEach(a=> a.onclick=()=>focusNode(a.dataset.go));
}

/* ============================================================
   INTERACTION
   ============================================================ */
function toggle(id){
  const n = nodeById(id); if(!n) return;
  if(!childrenOf(n).length) return;
  S.open[id] = !S.open[id];
  save(); paint();
}
function setOpenToDepth(maxD){
  S.open = {};
  (function walk(n, d){
    if(d < maxD){ S.open[n.id] = true; childrenOf(n).forEach(k=>walk(k, d+1)); }
  })(nodeById(rootId)||TREE, 0);
  S.open[rootId]=true;
  save(); paint(); home();
}

/* Marking a parent cascades down to everything under it, then rolls back up
   the ancestors so a section turns green once its last topic is finished. */
function setStatus(id, val){
  (function down(n){
    if(val===0) delete S.status[n.id]; else S.status[n.id]=val;
    childrenOf(n).forEach(down);
  })(nodeById(id));
  computeTallies();
  let pid = metaOf(id).parent;
  while(pid){
    const t = tally(nodeById(pid));
    if(t.total && t.done===t.total) S.status[pid]=2;
    else if(t.done||t.learn) S.status[pid]=1;
    else delete S.status[pid];
    pid = metaOf(pid).parent;
  }
  delete S.status["root"];
}
function cycleStatus(id){
  setStatus(id, ((S.status[id]||0)+1)%3);
  save(); paint();
}
function focusNode(id){
  rootId = id;
  S.open[id] = true;
  paint(); fit();
}
function addChild(id){
  const label = prompt("New sub-skill under “"+labelOf(nodeById(id))+"”:");
  if(!label || !label.trim()) return;
  const nid = "u"+(S.seq++)+"-"+Date.now().toString(36);
  (S.custom[id] = S.custom[id] || []).push({id:nid, l:label.trim(), n:"", c:[]});
  S.open[id]=true; save(); paint();
}
function editNote(id){
  const cur = S.notes[id]||"";
  const v = prompt("Your note (links, resources, next steps):", cur);
  if(v===null) return;
  if(v.trim()) S.notes[id]=v.trim(); else delete S.notes[id];
  save(); paint();
}
function rename(id){
  const n = nodeById(id);
  const v = prompt("Rename:", labelOf(n));
  if(v===null) return;
  if(!v.trim() || v.trim()===n.l) delete S.renamed[id]; else S.renamed[id]=v.trim();
  save(); paint();
}
function del(id){
  const n = nodeById(id);
  if(!confirm("Remove “"+labelOf(n)+"” and everything under it from your map?\n(You can undo this with Reset, or by re-importing a backup.)")) return;
  S.deleted[id]=true;
  if(rootId===id) rootId = metaOf(id).parent || "root";
  save(); paint();
}

nodesEl.addEventListener("click", e=>{
  const btn = e.target.closest(".tools button");
  const node = e.target.closest(".node");
  if(!node) return;
  const id = node.dataset.id;
  if(btn){
    e.stopPropagation();
    const a = btn.dataset.a;
    if(a==="status") cycleStatus(id);
    else if(a==="add") addChild(id);
    else if(a==="note") editNote(id);
    else if(a==="focus") focusNode(id);
    else if(a==="rename") rename(id);
    else if(a==="del") del(id);
    return;
  }
  if(e.detail > 1) return;      // ignore the 2nd click of a double-click
  selected = id;
  toggle(id);
});
nodesEl.addEventListener("dblclick", e=>{
  const node = e.target.closest(".node"); if(!node) return;
  e.preventDefault();
});

/* pan + zoom */
let panning=false, sx=0, sy=0, ox=0, oy=0;
viewport.addEventListener("mousedown", e=>{
  if(e.target.closest(".node")) return;
  panning=true; sx=e.clientX; sy=e.clientY; ox=view.x; oy=view.y;
  viewport.classList.add("drag");
});
window.addEventListener("mousemove", e=>{
  if(!panning) return;
  view.x = ox + (e.clientX-sx); view.y = oy + (e.clientY-sy); applyView();
});
window.addEventListener("mouseup", ()=>{ panning=false; viewport.classList.remove("drag"); });

viewport.addEventListener("wheel", e=>{
  if(e.ctrlKey || e.metaKey){
    e.preventDefault();
    zoomAt(e.clientX, e.clientY - 94, Math.pow(0.9986, e.deltaY*4));
  }else{
    e.preventDefault();
    view.x -= e.deltaX; view.y -= e.deltaY; applyView();
  }
}, {passive:false});

function zoomAt(px, py, factor){
  const k2 = Math.min(2.2, Math.max(0.12, view.k*factor));
  const r = k2/view.k;
  view.x = px - (px - view.x)*r;
  view.y = py - (py - view.y)*r;
  view.k = k2; applyView();
}
/* Fit is only worth doing when the result stays readable; past that point,
   park the map at the top-left at a comfortable zoom instead. */
function fit(minK){
  minK = minK ?? 0.34;
  requestAnimationFrame(()=>{
    const w = viewport.clientWidth, h = viewport.clientHeight;
    const k = Math.min((w-90)/(lastBounds.w||1), (h-70)/(lastBounds.h||1));
    if(k < minK) return home();
    view.k = Math.min(1, k);
    view.x = Math.max(30, (w - lastBounds.w*view.k)/2);
    view.y = Math.max(20, (h - lastBounds.h*view.k)/2);
    applyView();
  });
}
function home(){
  requestAnimationFrame(()=>{
    view.k = Math.max(0.5, Math.min(view.k, 0.85));
    view.x = 34; view.y = 22; applyView();
  });
}

document.getElementById("zIn").onclick  = ()=> zoomAt(viewport.clientWidth/2, viewport.clientHeight/2, 1.25);
document.getElementById("zOut").onclick = ()=> zoomAt(viewport.clientWidth/2, viewport.clientHeight/2, 0.8);
document.getElementById("zFit").onclick = ()=> fit(0.06);

/* toolbar */
document.querySelectorAll("[data-lvl]").forEach(b=> b.onclick = ()=> setOpenToDepth(+b.dataset.lvl));
document.getElementById("collapseAll").onclick = ()=>{ S.open={}; S.open[rootId]=true; save(); paint(); fit(0.3); };
document.getElementById("notesBtn").onclick = e=>{ showNotes=!showNotes; e.target.classList.toggle("on", !showNotes); paint(); };
document.getElementById("sideBtn").onclick = e=>{
  const s=document.getElementById("side"); s.classList.toggle("open");
  e.target.classList.toggle("on", s.classList.contains("open")); sidePanel();
};
document.getElementById("filter").onchange = e=>{ filter=e.target.value; paint(); fit(); };

let qTimer=null;
document.getElementById("search").addEventListener("input", e=>{
  clearTimeout(qTimer);
  qTimer = setTimeout(()=>{ query = e.target.value.trim().toLowerCase(); paint(); fit(); }, 180);
});
document.addEventListener("keydown", e=>{
  if(e.key==="/" && document.activeElement.tagName!=="INPUT"){ e.preventDefault(); document.getElementById("search").focus(); }
  if(e.key==="Escape"){ document.getElementById("search").value=""; query=""; paint(); }
});

document.getElementById("themeBtn").onclick = ()=>{
  document.documentElement.classList.toggle("dark");
  try{ localStorage.setItem(KEY+".theme", document.documentElement.classList.contains("dark")?"1":"0"); }catch(e){}
};

document.getElementById("exportBtn").onclick = ()=>{
  const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "skill-map-progress-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
};
document.getElementById("importBtn").onclick = ()=> document.getElementById("fileIn").click();
document.getElementById("fileIn").onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{ S = Object.assign(blank(), JSON.parse(r.result)); save(); paint(); fit(); flash("imported"); }
    catch(err){ alert("That file could not be read as a progress backup."); }
  };
  r.readAsText(f);
};
document.getElementById("resetBtn").onclick = ()=>{
  if(!confirm("Clear all statuses, notes and nodes you added?\nExport first if you want a backup.")) return;
  S = blank(); rootId="root"; save(); paint(); fit();
};

window.addEventListener("resize", ()=>{});

/* ---------- side panel markup ---------- */
const side = document.createElement("div");
side.id = "side";
side.innerHTML = '<button class="btn" id="closeSide">✕</button><h3>Progress by branch</h3><div id="branches"></div>';
document.body.appendChild(side);
document.getElementById("closeSide").onclick = ()=>{
  side.classList.remove("open");
  document.getElementById("sideBtn").classList.remove("on");
};

/* ---------- boot ---------- */
load();
try{ if(localStorage.getItem(KEY+".theme")==="1") document.documentElement.classList.add("dark"); }catch(e){}
if(!Object.keys(S.open).length) S.open = {root:true};
paint();
fit(0.3);
if(!storageOK) flash("in-memory only — use Export to keep a copy");
</script>
</body>
